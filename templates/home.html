
<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Placement Test</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="wrap"><section class="card" style="max-width:560px;margin:auto"><h1>English Placement Test</h1><p class="muted">اختبار تحديد مستوى اللغة الإنجليزية</p>{% with messages=get_flashed_messages() %}{% for m in messages %}<p class="error">{{m}}</p>{% endfor %}{% endwith %}<form method="post"><label>اسم الطالب</label><input name="student_name" required maxlength="120" placeholder="اكتب اسمك الكامل"><label>الرقم الجامعي (اختياري)</label><input name="student_ref" maxlength="80" placeholder="الرقم الجامعي"><label>كود الامتحان</label><input name="exam_code" required autocomplete="off" placeholder="أدخل الكود الموحد"><p class="small muted">لن تظهر نتيجتك بعد تسليم الامتحان.</p><button type="submit" style="width:100%">دخول الامتحان</button></form><p class="small muted" style="text-align:center;margin-top:22px"><a href="/admin">دخول الإدارة</a></p></section></main></body></html>
