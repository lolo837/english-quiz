
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Placement Test</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="wrap"><section class="card"><div class="row"><div><h1>English Placement Test</h1><p class="muted">Student: {{student}}</p></div><span class="pill" id="counter"></span></div><div class="progress"><span id="bar" style="width:0%"></span></div><form id="quiz"><div id="questions">{% for q in questions %}<section class="q" data-id="{{q.id}}" {% if not loop.first %}hidden{% endif %}><h3>{{loop.index}}. {{q.question}}</h3>{% for o in q.options %}<label class="opt"><input type="radio" name="q{{q.id}}" value="{{o.label}}"><span>{{o.label}}. {{o.text}}</span></label>{% endfor %}</section>{% endfor %}</div><div class="row" style="margin-top:22px"><button type="button" class="secondary" id="prev">السابق</button><button type="button" id="next">التالي</button><button type="button" id="finish" hidden>تسليم الامتحان</button></div></form><p class="small muted">لن تظهر العلامة أو الإجابات الصحيحة بعد التسليم.</p></section></main><script>
const sections=[...document.querySelectorAll('.q')];let current=0;const answers={};
function show(){sections.forEach((s,i)=>s.hidden=i!==current);document.getElementById('counter').textContent=`${current+1} / ${sections.length}`;document.getElementById('bar').style.width=((current+1)/sections.length*100)+'%';document.getElementById('prev').disabled=current===0;document.getElementById('next').hidden=current===sections.length-1;document.getElementById('finish').hidden=current!==sections.length-1;}
document.querySelectorAll('input[type=radio]').forEach(x=>x.addEventListener('change',()=>{answers[x.name.slice(1)]=x.value;}));
document.getElementById('prev').onclick=()=>{if(current>0){current--;show()}};
document.getElementById('next').onclick=()=>{if(current<sections.length-1){current++;show()}};
document.getElementById('finish').onclick=async()=>{const unanswered=sections.filter(s=>!answers[s.dataset.id]).length;if(unanswered&&!confirm(`لديك ${unanswered} سؤال بدون إجابة. هل تريد التسليم؟`))return;if(!confirm('هل أنت متأكد من تسليم الامتحان؟ لا يمكنك التعديل بعد ذلك.'))return;const b=document.getElementById('finish');b.disabled=true;b.textContent='جارٍ التسليم...';const r=await fetch('/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers})});const d=await r.json();if(d.ok){document.querySelector('.card').innerHTML='<h1>تم تسليم الامتحان بنجاح</h1><p>شكراً لك. تم استلام إجاباتك.</p><p class="muted">النتيجة غير معروضة للطالب.</p>';}else{alert(d.error||'حدث خطأ');b.disabled=false;b.textContent='تسليم الامتحان';}};
show();
</script></body></html>
